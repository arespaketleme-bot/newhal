<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080c16" />
  <title>NewHal · Bağlantı yok</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #080c16; color: #e5e7eb; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
    .box { text-align: center; max-width: 340px; }
    img { width: 96px; height: 96px; border-radius: 24px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #9ca3af; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
    button { background: linear-gradient(135deg, #10b981, #059669); color: #fff; border: 0; border-radius: 999px;
      padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/icons/icon-192.png" alt="NewHal" />
    <h1>İnternet bağlantısı yok</h1>
    <p>NewHal'i kullanmak için internete bağlanın. Bağlantı gelince sayfayı yenileyin.</p>
    <button onclick="location.reload()">Tekrar Dene</button>
  </div>
</body>
</html>
