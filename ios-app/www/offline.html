<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NewHal · Bağlantı yok</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:-apple-system, system-ui, sans-serif; background:#f4f7f5; color:#0f172a; padding:24px; box-sizing:border-box; text-align:center; }
  @media (prefers-color-scheme: dark) { body { background:#080c16; color:#f8fafc; } p { color:#94a3b8 !important; } }
  .box { max-width:340px; display:flex; flex-direction:column; gap:14px; align-items:center; }
  .ico { font-size:56px; }
  h1 { font-size:22px; margin:0; }
  p { margin:0; color:#526072; line-height:1.5; }
  button { margin-top:6px; padding:14px 26px; border:0; border-radius:999px; font:inherit; font-weight:700; font-size:16px; color:#fff; background:linear-gradient(135deg,#10b981,#059669); }
</style></head>
<body><div class="box">
  <div class="ico">📡</div>
  <h1>İnternet bağlantısı yok</h1>
  <p>NewHal'i açmak için internet gerekiyor. Wi-Fi ya da mobil veriyi kontrol edip tekrar deneyin.</p>
  <button type="button" onclick="location.replace('https://newhal.com/?kaynak=ios')">Tekrar dene</button>
</div>
<script>
  // Bağlantı gelince kendiliğinden yeniden dener
  window.addEventListener('online', () => location.replace('https://newhal.com/?kaynak=ios'));
</script>
</body></html>
